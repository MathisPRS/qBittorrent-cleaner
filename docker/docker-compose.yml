name: webhook-cleaner-stack

networks:
  media_net:
    external: true
    name: media_net

services:
  webhook-cleaner:
    build:
      context: .
      dockerfile: Dockerfile
    image: webhook-cleaner:latest
    container_name: webhook-cleaner
    networks: [media_net]
    ports:
      - "8124:8124"
    environment:
      - CONFIG_FILE=/app/configlocal.cfg
      - CLEANER_CACHE_TTL=0              # 15 min
      - CLEANER_CACHE_FILE=/app/data/cache.json
      - CLEANER_CACHE_MAX_ITEMS=1000
    volumes:
      - ./configlocal.cfg:/app/configlocal.cfg:ro
      - ./logs:/app/logs
      - ./data:/app/data                   # <— persistance du cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8124/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3