name: webhook-cleaner-stack

networks:
  media_net:
    external: true
    name: media_net

services:
  webhook-cleaner:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: webhook-cleaner:latest
    container_name: webhook-cleaner
    networks:
      - media_net
    ports:
      - "8124:8124"              # optionnel, fichier .env à la racine du repo
    volumes:
      - ../configlocal.cfg:/app/configlocal.cfg:ro
      - ../logs:/app/logs
      - ../data:/app/data
      - ../:/app:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8124/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    working_dir: /app
