name: webhook-cleaner-stack

networks:
  media_net:
    external: true
    name: media_net

services:
  redis:
    image: redis:7-alpine
    container_name: webhook-cleaner-redis
    networks:
      - media_net
    restart: unless-stopped
    volumes:
      - ../data/redis:/data
    environment:
      - APP_UID=${APP_UID:-1000}
      - APP_GID=${APP_GID:-1000}
    command: sh -c "chown -R ${APP_UID:-1000}:${APP_GID:-1000} /data || true; exec redis-server --dir /data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

  webhook-cleaner:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: webhook-cleaner:latest
    container_name: webhook-cleaner
    networks:
      - media_net
    ports:
      - "8124:8124"
    volumes:
      - ../configlocal.cfg:/app/configlocal.cfg:ro
      - ../data:/app/data
      - ../logs:/app/logs
      - ../:/app:rw
    environment:
      - APP_UID=${APP_UID:-1000}
      - APP_GID=${APP_GID:-1000}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8124/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    working_dir: /app
    command: bash -lc "flask db upgrade && python run.py"

  celery-worker:
    image: webhook-cleaner:latest
    container_name: webhook-cleaner-worker
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    command: celery -A app.celery_worker.celery worker --loglevel=info --concurrency=1
    networks:
      - media_net
    volumes:
      - ../configlocal.cfg:/app/configlocal.cfg:ro
      - ../data:/app/data
      - ../logs:/app/logs
      - ../:/app:rw
    environment:
      - APP_UID=${APP_UID:-1000}
      - APP_GID=${APP_GID:-1000}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped
    working_dir: /app

  celery-beat:
    image: webhook-cleaner:latest
    container_name: webhook-cleaner-beat
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    command: >
      celery -A app.celery_worker.celery beat
      --loglevel=info
      -s /app/data/celerybeat-schedule
    networks:
      - media_net
    volumes:
      - ../configlocal.cfg:/app/configlocal.cfg:ro
      - ../data:/app/data
      - ../logs:/app/logs
      - ../:/app:rw
    environment:
      - APP_UID=${APP_UID:-1000}
      - APP_GID=${APP_GID:-1000}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped
    working_dir: /app