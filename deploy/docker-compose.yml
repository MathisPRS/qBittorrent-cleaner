name: webhook-cleaner-stack

networks:
  media_net:
    external: false
    name: media_net

services:
  redis:
    image: redis:7-alpine
    container_name: webhook-cleaner-redis
    networks:
      - media_net
    restart: unless-stopped
    # bind host ./data/redis to redis /data
    volumes:
      - ../data/redis:/data
    # ensure proper ownership on start and then run redis
    environment:
      - APP_UID=153192260
      - APP_GID=153192260
    command: sh -c "chown -R ${APP_UID}:${APP_GID} /data || true; exec redis-server --dir /data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

  webhook-cleaner:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP_UID: 153192260
        APP_GID: 153192260
    image: webhook-cleaner:latest
    container_name: webhook-cleaner
    networks:
      - media_net
    ports:
      - "8124:8124"
    volumes:
      - ../configlocal.cfg:/app/configlocal.cfg:ro
      - ../data:/app/data
      - ../logs:/app/logs
      - ../:/app:rw
    environment:
      - APP_UID=153192260
      - APP_GID=153192260
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8124/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    working_dir: /app
    command: bash -lc "flask db upgrade && python run.py"

  celery-worker:
    image: webhook-cleaner:latest
    container_name: webhook-cleaner-worker
    user: "153192260:153192260"
    command: celery -A app.extensions.celery worker --loglevel=info --concurrency=1
    networks:
      - media_net
    volumes:
      - ../configlocal.cfg:/app/configlocal.cfg:ro
      - ../data:/app/data
      - ../logs:/app/logs
      - ../:/app:rw
    environment:
      - APP_UID=153192260
      - APP_GID=153192260
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped
    working_dir: /app

  celery-beat:
    image: webhook-cleaner:latest
    container_name: webhook-cleaner-beat
    user: "153192260:153192260"
    command: >
      celery -A app.extensions.celery beat
      --loglevel=info
      -s /app/data/celerybeat-schedule
    networks:
      - media_net
    volumes:
      - ../configlocal.cfg:/app/configlocal.cfg:ro
      - ../data:/app/data
      - ../logs:/app/logs
      - ../:/app:rw
    environment:
      - APP_UID=153192260
      - APP_GID=153192260
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped
    working_dir: /app