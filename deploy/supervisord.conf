[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
loglevel=info

[program:redis]
command=/usr/bin/redis-server /etc/redis/redis.conf
autostart=true
autorestart=true
stdout_logfile=/var/log/app/redis.out.log
stderr_logfile=/var/log/app/redis.err.log
priority=10
; run as root (no user=), because redis may need to write to system dirs

[program:web]
command=bash -lc "flask db upgrade && python run.py"
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/app/web.out.log
stderr_logfile=/var/log/app/web.err.log
priority=20
user=appuser

[program:celery-worker]
command=bash -lc "celery -A app.extensions.celery worker --loglevel=info --concurrency=1"
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/app/worker.out.log
stderr_logfile=/var/log/app/worker.err.log
priority=30
user=appuser

[program:celery-beat]
; removed --pidfile to avoid permission issues
command=bash -lc "celery -A app.extensions.celery beat --loglevel=info"
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/app/beat.out.log
stderr_logfile=/var/log/app/beat.err.log
priority=40
user=appuser