name: webhook-cleaner

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: webhook-cleaner:latest
    container_name: webhook-cleaner
    ports:
      - "8124:8124"
    environment:
      - CONFIG_FILE=/app/configlocal.cfg
    volumes:
      - ./configlocal.cfg:/app/configlocal.cfg:ro
      - ./logs:/var/log/webhook-cleaner
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8124/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
